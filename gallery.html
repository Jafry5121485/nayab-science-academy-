<title>Academy Gallery | Nayab Science Academy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
}

header{
    background:#006400;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:8px;
}

.back-btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    background:white;
    color:#006400;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.back-btn:hover{
    background:#e6e6e6;
}

.gallery{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.05);
}

footer{
    background:#006400;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>

</head>
